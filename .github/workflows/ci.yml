name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:analytics
      - run: npm run test:consumers
      - run: npm run pack:package
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - run: CHARTKIT_TEST_STATIC=1 npm run test:e2e -- tests/e2e/gallery.spec.ts tests/e2e/readiness.spec.ts tests/e2e/page-loading.spec.ts tests/e2e/motion.spec.ts tests/e2e/analytics.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 14
  visual:
    # Baselines are reviewed on macOS; Linux runs the structural and interaction audit above.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:site
      - run: CHARTKIT_TEST_STATIC=1 npm run test:e2e -- tests/e2e/visual.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures
          path: test-results/
          retention-days: 14
